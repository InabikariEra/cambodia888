<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ศุภฤกษ์ จงประจันต์</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050510;
      font-family: "Segoe UI", "Noto Sans Thai", sans-serif;
      overflow: hidden;
      position: relative;
    }

    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,0,128,.18), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(0,255,255,.18), transparent 45%);
      animation: bgMove 8s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }

    .card {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 60px 50px;
      border-radius: 30px;
      background: rgba(10,10,25,.65);
      border: 2px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 30px rgba(255,0,255,.25),
        0 0 80px rgba(0,255,255,.18);
      animation: cardRGB 4s linear infinite;
      max-width: 700px;
      width: calc(100% - 40px);
    }

    @keyframes cardRGB {
      0%   { box-shadow: 0 0 30px #ff0080, 0 0 80px #ff008055; border-color: #ff0080; }
      25%  { box-shadow: 0 0 30px #ffee00, 0 0 80px #ffee0055; border-color: #ffee00; }
      50%  { box-shadow: 0 0 30px #00ff88, 0 0 80px #00ff8855; border-color: #00ff88; }
      75%  { box-shadow: 0 0 30px #00cfff, 0 0 80px #00cfff55; border-color: #00cfff; }
      100% { box-shadow: 0 0 30px #ff0080, 0 0 80px #ff008055; border-color: #ff0080; }
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      animation:
        textRGB 2s linear infinite,
        blink 1.2s steps(2, start) infinite;
      text-shadow:
        0 0 8px #fff,
        0 0 20px currentColor,
        0 0 45px currentColor;
    }

    @keyframes textRGB {
      0%   { color: #ff0080; }
      20%  { color: #ff8800; }
      40%  { color: #ffee00; }
      60%  { color: #00ff88; }
      80%  { color: #00cfff; }
      100% { color: #ff0080; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }

    p {
      margin-top: 16px;
      color: rgba(255,255,255,.75);
      animation: textRGB 3s linear infinite;
    }

    .deploy-btn {
      margin-top: 36px;
      padding: 16px 34px;
      border: none;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #050510;
      cursor: pointer;
      background: linear-gradient(90deg, #ff0080, #ffee00, #00ff88, #00cfff, #ff0080);
      background-size: 300% 100%;
      animation: btnRGB 3s linear infinite;
      box-shadow: 0 0 25px rgba(255,255,255,.35);
      transition: transform .2s ease;
    }

    .deploy-btn:hover {
      transform: scale(1.06);
    }

    @keyframes btnRGB {
      to { background-position: 300% center; }
    }

    .status {
      margin-top: 20px;
      min-height: 26px;
      font-size: .95rem;
      animation: textRGB 2.5s linear infinite;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 12px #00ff88;
      animation: blink .8s steps(2, start) infinite;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <main class="card">
    <h1>ศุภฤกษ์ จงประจันต์</h1>
    <p>RGB Neon Effect • HTML + CSS + JavaScript</p>

    <button class="deploy-btn" onclick="openDeploy()">
      🚀 Deploy เว็บให้ออนไลน์
    </button>

    <div class="status" id="status"></div>
  </main>

  <script>
    function openDeploy() {
      const status = document.getElementById("status");
      status.innerHTML = '<span class="dot"></span>กำลังเปิดหน้า Deploy...';
      window.open("https://app.netlify.com/drop", "_blank");

      setTimeout(() => {
        status.innerHTML =
          '<span class="dot"></span>ลากโฟลเดอร์ที่มี index.html ไปวาง เพื่อให้เว็บออนไลน์ตลอด';
      }, 1200);
    }
  </script>
</body>
</html>
