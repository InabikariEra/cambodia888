<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050509">
  <title>Suparuek Jongprachan 12</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #050509;
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050509;
      font-family: Arial, sans-serif;
      isolation: isolate;
    }

    /* แสง RGB พื้นหลัง */
    .ambient {
      position: fixed;
      inset: -30%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 25% 35%,
          #ff008033,
          transparent 45%
        ),
        radial-gradient(
          ellipse at 75% 65%,
          #00d9ff33,
          transparent 45%
        ),
        radial-gradient(
          ellipse at 50% 50%,
          #9500ff22,
          transparent 55%
        );
      animation: ambient-rgb 16s linear infinite;
    }

    /* ตารางบาง ๆ */
    .grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(#ffffff05 1px, transparent 1px),
        linear-gradient(90deg, #ffffff05 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse, black, transparent 80%);
    }

    main {
      width: 100%;
      padding: 32px 20px;
      text-align: center;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #ff5ab9;
      font-size: clamp(28px, 6vw, 110px);
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: -0.035em;
      text-wrap: balance;
      text-shadow:
        0 0 8px currentColor,
        0 0 25px currentColor,
        0 0 65px currentColor;
      animation:
        text-rgb 10s linear infinite,
        shimmer 4s ease-in-out infinite;
    }

    /* ประกายแสง */
    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: var(--size);
      height: var(--size);
      color: #b8f6ff;
      background: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px currentColor;
      opacity: 0;
      animation:
        twinkle var(--duration) ease-in-out infinite,
        spark-rgb 12s linear infinite;
      animation-delay: var(--delay), 0s;
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .spark::before {
      width: 1px;
      height: 12px;
    }

    .spark::after {
      width: 12px;
      height: 1px;
    }

    @keyframes text-rgb {
      0%, 100% { color: #ff5ab9; }
      20% { color: #ffb85a; }
      40% { color: #dcff70; }
      60% { color: #63ffc5; }
      80% { color: #68d7ff; }
      90% { color: #b995ff; }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50% { opacity: .72; }
    }

    @keyframes ambient-rgb {
      to {
        filter: hue-rotate(360deg);
        transform: rotate(20deg);
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0;
        transform: translateY(12px) scale(.3);
      }

      50% {
        opacity: .85;
        transform: translateY(-12px) scale(1);
      }
    }

    @keyframes spark-rgb {
      to {
        filter: hue-rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }

      .sparkles {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="sparkles" aria-hidden="true"></div>

  <main>
    <h1>Suparuek Jongprachan 12</h1>
  </main>

  <script>
    const container = document.querySelector(".sparkles");
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < 45; i++) {
      const spark = document.createElement("span");

      spark.className = "spark";
      spark.style.left = `${Math.random() * 100}%`;
      spark.style.top = `${Math.random() * 100}%`;
      spark.style.setProperty("--size", `${2 + Math.random() * 2}px`);
      spark.style.setProperty("--duration", `${3 + Math.random() * 5}s`);
      spark.style.setProperty("--delay", `${-Math.random() * 8}s`);

      fragment.appendChild(spark);
    }

    container.appendChild(fragment);
  </script>
</body>
</html>
